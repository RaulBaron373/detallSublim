<div xmlns:th="http://www.thymeleaf.org">
  <div
    style="
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.1);
      color: #7c3aed;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    "
  >
    SEGURIDAD
  </div>

  <h1 style="margin: 0 0 16px; color: #081a35; font-size: 28px; line-height: 36px">Restablece tu contraseña</h1>

  <p style="margin: 0 0 14px; color: #555b68; font-size: 15px; line-height: 24px">
    Hola
    <strong th:text="${user.login}">usuario</strong>,
  </p>

  <p style="margin: 0 0 26px; color: #555b68; font-size: 15px; line-height: 24px">
    Hemos recibido una solicitud para cambiar la contraseña asociada a tu cuenta de Detall Sublim.
  </p>

  <div style="text-align: center; margin: 30px 0">
    <a
      th:with="url=(@{|${baseUrl}/account/reset/finish#key=${user.resetKey}|})"
      th:href="${url}"
      style="
        display: inline-block;
        padding: 14px 24px;
        border-radius: 999px;
        background: #d84b8a;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      "
    >
      Restablecer contraseña
    </a>
  </div>

  <div
    style="
      margin-top: 26px;
      padding: 16px 18px;
      border-radius: 14px;
      background: #fff9df;
      color: #71631b;
      font-size: 13px;
      line-height: 20px;
    "
  >
    Si no solicitaste este cambio, puedes ignorar este correo. Tu contraseña actual seguirá funcionando.
  </div>
</div>
