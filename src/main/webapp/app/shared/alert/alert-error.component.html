<div class="ds-alerts">
  @for (alert of alerts(); track $index) {
    @if (alert.message) {
      <div class="ds-alert ds-alert-danger">
        <div class="ds-alert-content">
          <span class="ds-alert-message">
            {{ alert.message }}
          </span>
        </div>

        <button class="ds-alert-close" (click)="close(alert)">✕</button>
      </div>
    }
  }
</div>
