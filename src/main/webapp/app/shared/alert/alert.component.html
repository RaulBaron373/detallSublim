<div class="ds-alerts">
  @for (alert of alerts(); track $index) {
    <div class="ds-alert" [ngClass]="'ds-alert-' + alert.type">
      <div class="ds-alert-content">
        <span class="ds-alert-message" [innerHTML]="alert.message"></span>
      </div>

      <button class="ds-alert-close" (click)="close(alert)">✕</button>
    </div>
  }
</div>
