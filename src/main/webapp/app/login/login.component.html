<section class="login-page">
  <div class="login-background">
    <div class="login-blob login-blob-pink"></div>
    <div class="login-blob login-blob-cyan"></div>
    <div class="login-blob login-blob-yellow"></div>
  </div>

  <div class="ds-container">
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-brand">
          <img class="login-logo" src="content/images/logo-detall-sublim-color.png" alt="Detall Sublim" />
        </div>

        <span class="login-tag">Acceso interno</span>

        <h1 data-cy="loginTitle">Iniciar sesión</h1>
        <p class="login-subtitle">Acceso privado para la gestión interna de Detall Sublim.</p>

        @if (authenticationError()) {
          <div class="login-error" data-cy="loginError">
            <strong>Error de autenticación.</strong>
            Revisa las credenciales e inténtalo de nuevo.
          </div>
        }

        <form class="login-form" (ngSubmit)="login()" [formGroup]="loginForm">
          <div class="form-group">
            <label for="username">Usuario</label>
            <input
              type="text"
              id="username"
              class="form-control"
              formControlName="username"
              placeholder="Introduce tu usuario"
              data-cy="username"
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              class="form-control"
              formControlName="password"
              placeholder="Introduce tu contraseña"
              data-cy="password"
            />
          </div>

          <label class="remember-row" for="rememberMe">
            <input type="checkbox" id="rememberMe" class="form-check-input" formControlName="rememberMe" />
            <span>Mantener sesión iniciada</span>
          </label>

          <button type="submit" class="ds-btn ds-btn-primary login-submit" data-cy="submit">Iniciar sesión</button>
        </form>
      </div>
    </div>
  </div>
</section>
